<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울 지하철 이용량 시각화</title>
<style>
:root{font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;color:#25334c;background:#eff4f9;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0}
main{width:100%;height:100svh;min-height:390px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:3vh 4vw 4vh 3.4vw;background:radial-gradient(ellipse at 56% 61%,#fff8,transparent 62%),linear-gradient(164deg,#e4effc,#f0f5fa 78%);overflow:hidden}
.stage{position:relative;display:grid;grid-template-columns:clamp(112px,14.3vw,260px) minmax(0,1fr);align-items:center;gap:2vw;isolation:isolate;min-height:0}
.stage:before,.stage:after{content:"";position:absolute;z-index:-1;border-radius:50%;border:1px solid #b8d4ee70;pointer-events:none}
.stage:before{width:720px;height:270px;left:-430px;bottom:10px;transform:rotate(26deg)}
.stage:after{width:800px;height:310px;right:-450px;top:0;transform:rotate(-26deg)}
.legend{background:#ffffffd9;border:1px solid #fff;border-radius:24px;padding:clamp(10px,1.8vw,30px);font-size:clamp(13px,1.3vw,21px);box-shadow:0 6px 24px #6e94b210;z-index:1}
.legend b{display:block;text-align:center;border-radius:100px;background:#85a2f6;color:white;padding:8px 5px;font-size:.9em;margin-bottom:20px}
.key{display:flex;align-items:center;gap:10px;margin:16px 6px}
.swatch{width:14px;height:12px;border-radius:4px;background:#909ed4}
.swatch.green{width:12px;border-radius:50%;background:#9acbac}
.transfer{display:inline-grid;place-items:center;width:14px;height:12px;border-radius:4px;background:#909ed4}
.transfer:after{content:"";width:6px;height:6px;border-radius:50%;background:#9acbac;border:1px solid white}
svg{display:block;width:100%;height:100%;min-height:0;overflow:visible}
.edge{fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
.node text{font-weight:650;letter-spacing:-.05em;fill:#24324b;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.transport{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:24px;width:72%;margin-left:19%;padding:18px 30px;background:#ffffffdf;border:1px solid white;border-radius:100px;box-shadow:0 8px 26px #708eb319}
button{width:44px;height:44px;border:none;border-radius:50%;background:#93aefd;color:white;font-size:18px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #345cbc;outline-offset:3px}
input{appearance:none;display:block;width:100%;height:8px;margin:0;cursor:pointer;border-radius:12px;background:linear-gradient(to right,#97b1d8 var(--progress,0%),#c4d3e6 var(--progress,0%))}
input::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border:2px solid #adc7f4;border-radius:50%;background:white}
input::-moz-range-thumb{width:16px;height:16px;border:2px solid #adc7f4;border-radius:50%;background:white}
output{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:650px){main{padding:14px 14px 20px}.stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:4px}.legend{justify-self:start;display:flex;align-items:center;gap:8px;padding:3px 12px}.legend b{display:none}.key{font-size:11px;margin:8px 3px}.transport{width:100%;margin:0;gap:12px;padding:10px 15px;grid-template-columns:36px minmax(0,1fr) auto}.transport button{width:36px;height:36px}output{font-size:13px}}
</style>
</head>
<body><main>
<div class="stage">
<aside class="legend" aria-label="노선 범례"><b>노선</b><div class="key"><i class="swatch"></i>1호선</div><div class="key"><i class="swatch green"></i>2호선</div><div class="key"><i class="transfer"></i>환승역</div></aside>
<svg id="chart" viewBox="0 0 1040 600" role="img" aria-label="시간대별 서울 지하철 이용량 버블 차트">
<defs><radialGradient id="line1" cx="43%" cy="37%" r="73%"><stop stop-color="#b3c0ed"/><stop offset=".78" stop-color="#909ed4"/><stop offset="1" stop-color="#909ed4" stop-opacity=".57"/></radialGradient><radialGradient id="line2" cx="43%" cy="37%" r="73%"><stop stop-color="#c2e4d0"/><stop offset=".78" stop-color="#9acbac"/><stop offset="1" stop-color="#9acbac" stop-opacity=".57"/></radialGradient></defs>
<g id="edges"></g><g id="nodes"></g></svg>
</div>
<div class="transport"><button id="play" type="button" aria-label="재생">▶</button><input id="time" type="range" min="0" max="17" step="any" value="2" aria-label="시간대"><output id="clock" for="time">08:00</output></div>
</main><script src="data.js"></script><script src="main.js"></script></body></html>
